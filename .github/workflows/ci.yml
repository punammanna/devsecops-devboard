
name: CI

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Clone repository
      - name: Clone code
        uses: actions/checkout@v4

      # Docker login
      - name: Docker Setup (Login)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      # Docker build
      - name: Docker Build
        run: docker build -t myapp .
